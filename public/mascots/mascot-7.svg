<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Mascot 7: Scholarly Professor (Graduation Cap, Round Glasses & Theory Book) -->
  <ellipse cx="50" cy="94" rx="26" ry="5" fill="#0c1017" opacity="0.35"/>
  <!-- Feet -->
  <path d="M40 88 C40 92 36 94 33 94 C30 94 32 89 36 86 Z" fill="#f59e0b"/>
  <path d="M60 88 C60 92 64 94 67 94 C70 94 68 89 64 86 Z" fill="#f59e0b"/>
  <!-- Bird Body -->
  <ellipse cx="50" cy="56" rx="34" ry="36" fill="#3b5998"/>
  <path d="M50 20 C28 20 20 38 20 60 C20 78 32 90 50 90 C68 90 80 78 80 60 C80 38 72 20 50 20 Z" fill="#4a69ad"/>
  <!-- Belly -->
  <ellipse cx="50" cy="65" rx="22" ry="20" fill="#e2e8f0"/>
  <!-- Eyes -->
  <circle cx="38" cy="44" r="8.5" fill="#ffffff"/>
  <circle cx="62" cy="44" r="8.5" fill="#ffffff"/>
  <circle cx="39" cy="45" r="5" fill="#1e293b"/>
  <circle cx="61" cy="45" r="5" fill="#1e293b"/>
  <circle cx="37" cy="43" r="2" fill="#ffffff"/>
  <circle cx="59" cy="43" r="2" fill="#ffffff"/>
  <!-- Round Gold Spectacles/Glasses -->
  <circle cx="38" cy="44" r="9.5" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
  <circle cx="62" cy="44" r="9.5" stroke="#f59e0b" stroke-width="1.8" fill="none"/>
  <line x1="47.5" y1="44" x2="52.5" y2="44" stroke="#f59e0b" stroke-width="2"/>
  <!-- Beak -->
  <path d="M45 50 C45 50 50 47 55 50 C55 50 51 58 50 58 C49 58 45 50 45 50 Z" fill="#f59e0b"/>
  <path d="M46 50 L54 50" stroke="#d97706" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Cheeks Blush -->
  <circle cx="28" cy="51" r="4.5" fill="#f472b6" opacity="0.45"/>
  <circle cx="72" cy="51" r="4.5" fill="#f472b6" opacity="0.45"/>
  <!-- Graduation Cap (Mortarboard) -->
  <path d="M50 14 L84 22 L50 30 L16 22 Z" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <rect x="36" y="24" width="28" height="6" rx="2" fill="#1e293b"/>
  <!-- Gold Tassel -->
  <circle cx="50" cy="22" r="2" fill="#f59e0b"/>
  <path d="M50 22 C58 22 66 26 68 34" stroke="#f59e0b" stroke-width="1.5" fill="none"/>
  <rect x="66" y="34" width="4" height="6" rx="1" fill="#eab308"/>
  <!-- Chess Theory Book in Wing -->
  <g transform="translate(10, 58)">
    <rect x="1" y="2" width="18" height="22" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1.2"/>
    <rect x="3" y="4" width="14" height="18" fill="#fef3c7"/>
    <line x1="6" y1="8" x2="14" y2="8" stroke="#92400e" stroke-width="1.2"/>
    <line x1="6" y1="12" x2="14" y2="12" stroke="#92400e" stroke-width="1.2"/>
    <line x1="6" y1="16" x2="12" y2="16" stroke="#92400e" stroke-width="1.2"/>
  </g>
</svg>