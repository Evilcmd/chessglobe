  <path d="M30 24 L34 10 L42 16 L50 6 L58 16 L66 10 L70 24 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
  <!-- Crown Jewels -->
  <circle cx="50" cy="5" r="2" fill="#ef4444"/>
  <circle cx="34" cy="9.5" r="1.5" fill="#3b82f6"/>
  <circle cx="66" cy="9.5" r="1.5" fill="#3b82f6"/>
  <circle cx="50" cy="18" r="2" fill="#ef4444"/>
  <circle cx="40" cy="19" r="1.5" fill="#10b981"/>
  <circle cx="60" cy="19" r="1.5" fill="#10b981"/>
  <rect x="29" y="21" width="42" height="4" rx="2" fill="#d97706"/>
  <!-- Royal Mantle Cape -->
  <path d="M22 62 C26 56 36 54 50 54 C64 54 74 56 78 62 C82 72 80 84 76 88 C70 85 64 82 50 82 C36 82 30 85 24 88 C20 84 18 72 22 62 Z" fill="#b91c1c" stroke="#991b1b" stroke-width="1.2"/>
  <!-- Ermine Fur Collar (White with black specks) -->
  <path d="M22 60 C26 56 38 54 50 54 C62 54 74 56 78 60 C78 65 72 68 64 68 C58 68 54 66 50 66 C46 66 42 68 36 68 C28 68 22 65 22 60 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="34" cy="62" r="1" fill="#0f172a"/>
  <circle cx="44" cy="61" r="1" fill="#0f172a"/>
  <circle cx="56" cy="61" r="1" fill="#0f172a"/>
  <circle cx="66" cy="62" r="1" fill="#0f172a"/>
  <!-- Golden King Scepter -->
  <g transform="translate(73, 52)">
    <line x1="3" y1="2" x2="11" y2="30" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="2" cy="1" r="4.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
    <!-- Cross on top of scepter -->
    <line x1="2" y1="-5" x2="2" y2="-1" stroke="#ef4444" stroke-width="1.8"/>
    <line x1="0" y1="-3" x2="4" y2="-3" stroke="#ef4444" stroke-width="1.8"/>
  </g>
</svg>