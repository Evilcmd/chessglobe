<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Mascot 4: Royal King (King's Crown, Ermine Royal Cape & Scepter) -->
  <ellipse cx="50" cy="94" rx="26" ry="5" fill="#0c1017" opacity="0.35"/>
  <!-- Feet -->
  <path d="M40 88 C40 92 36 94 33 94 C30 94 32 89 36 86 Z" fill="#f59e0b"/>
  <path d="M60 88 C60 92 64 94 67 94 C70 94 68 89 64 86 Z" fill="#f59e0b"/>
  <!-- Bird Body -->
  <ellipse cx="50" cy="56" rx="34" ry="36" fill="#3b5998"/>
  <path d="M50 20 C28 20 20 38 20 60 C20 78 32 90 50 90 C68 90 80 78 80 60 C80 38 72 20 50 20 Z" fill="#4a69ad"/>
  <!-- Belly -->
  <ellipse cx="50" cy="65" rx="22" ry="20" fill="#e2e8f0"/>
  <!-- Eyes -->
  <circle cx="38" cy="44" r="8.5" fill="#ffffff"/>
  <circle cx="62" cy="44" r="8.5" fill="#ffffff"/>
  <circle cx="39" cy="45" r="5" fill="#1e293b"/>
  <circle cx="61" cy="45" r="5" fill="#1e293b"/>
  <circle cx="37" cy="43" r="2" fill="#ffffff"/>
  <circle cx="59" cy="43" r="2" fill="#ffffff"/>
