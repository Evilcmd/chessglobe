  <path d="M22 62 C26 56 36 54 50 54 C64 54 74 56 78 62 C82 72 80 84 76 88 C70 85 64 82 50 82 C36 82 30 85 24 88 C20 84 18 72 22 62 Z" fill="#4338ca" stroke="#312e81" stroke-width="1.2"/>
