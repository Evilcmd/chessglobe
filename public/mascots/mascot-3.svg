  <circle cx="38" cy="42" r="8.5" fill="#ffffff"/>
  <circle cx="62" cy="42" r="8.5" fill="#ffffff"/>
  <circle cx="39" cy="43" r="5" fill="#1e1b4b"/>
  <circle cx="61" cy="43" r="5" fill="#1e1b4b"/>
