  <path d="M82 12 C77 12 73 16 73 22 C73 28 77 32 82 32 C80 30 78 26 78 22 C78 18 80 14 82 12 Z" fill="#fef08a" stroke="#facc15" stroke-width="0.8"/>
  <!-- Stars -->
  <path d="M22 18 L23 15 L26 14 L23 13 L22 10 L21 13 L18 14 L21 15 Z" fill="#fde047"/>
  <path d="M78 8 L78.5 6 L80.5 5.5 L78.5 5 L78 3 L77.5 5 L75.5 5.5 L77.5 6 Z" fill="#fde047"/>
