  <ellipse cx="50" cy="56" rx="34" ry="36" fill="#312e81"/>
  <path d="M50 20 C28 20 20 38 20 60 C20 78 32 90 50 90 C68 90 80 78 80 60 C80 38 72 20 50 20 Z" fill="#3730a3"/>
