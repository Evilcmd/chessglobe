  <path d="M50 54.5 L51 56.5 L53 57 L51 57.5 L50 59.5 L49 57.5 L47 57 L49 56.5 Z" fill="#ffffff"/>
  <!-- Golden Chess Queen Piece in wing -->
  <g transform="translate(13, 58)">
    <path d="M3 20 L15 20 L13 14 L15 8 L11 11 L9 6 L7 11 L3 8 L5 14 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>
    <circle cx="9" cy="5" r="1.5" fill="#fef08a"/>
    <circle cx="3" cy="7.5" r="1" fill="#fef08a"/>
    <circle cx="15" cy="7.5" r="1" fill="#fef08a"/>
    <rect x="2" y="19" width="14" height="3" rx="1" fill="#d97706"/>
  </g>
</svg>